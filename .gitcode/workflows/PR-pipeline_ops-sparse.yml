name: PR-pipeline_ops-sparse

concurrency:
  max: 15
  exceed-action: QUEUE
  enable: true
  preemption:
    enable: true
    events: [mr_id]

on:
  workflow_dispatch:
  pull_request_comment:
    types: [created]
    branches: [ '**' ]
    comments: [ '^(?:\/)?compile*' ]
  pr_comment:
    types: [ created ]
    keyword: '^(?:\/)?compile*'

env:
  org_name: "${{ vars.ORG_NAME }}"
  repo_name: ${{atomgit.event.repository.name}}
  MERGE_ID: ${{atomgit.event.pull_request.number}}
  obs_path: "${{ env.org_name }}/${{ env.repo_name }}/ci/package/${{ env.MERGE_ID }}"
  TARGET_BRANCH: ${{atomgit.ref_name}}
  SOURCE_BRANCH: ${{atomgit.head_ref}}
  obs_smoke_path: "${{ env.obs_path }}/presmoke/2"
  online: ${{ vars.APPLY_LABEL }}
stages:
  stage1:
    name: PreBuild
    jobs:
      JOB_image:
        name: Test_image
        steps:
          - name: revise_image
            identifier: revise_image
            uses: cann/.gitcode/actions/revise-img@master
            with:
              repo_name: ${{ env.repo_name }}
              target_branch: ${{ env.TARGET_BRANCH }}
              comment: ${{ atomgit.event.comment.body }}
              token: ${{ secrets.TESTTOKEN }}
          -
            name: show_output
            run: |
              echo "Compile_Ascend_X86_A2: ${{ steps.revise_image.outputs.Compile_Ascend_X86_A2 }}"
              echo "Compile_Ascend_X86_A5: ${{ steps.revise_image.outputs.Compile_Ascend_X86_A5 }}"
              echo "Compile_Ascend_ARM_A2: ${{ steps.revise_image.outputs.Compile_Ascend_ARM_A2 }}"
              echo "Compile_Ascend_ARM_A5: ${{ steps.revise_image.outputs.Compile_Ascend_ARM_A5 }}"
              echo "PreSmoke_A900: ${{ steps.revise_image.outputs.PreSmoke_A900 }}"
              echo "precommit: ${{ steps.revise_image.outputs.precommit }}"
              echo "codecheck: ${{ steps.revise_image.outputs.codecheck }}"
              echo "staticcheck: ${{ steps.revise_image.outputs.staticcheck }}"
        runs-on: ["self-hosted", "arch=x64", "spec=small"]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu20.04.05_x86:k8s_v1.1006
      JOB_pre:
        name: Test_PreBuild
        uses: cann/.gitcode/.gitcode/workflows/pre_action.yml@master
    pre:
    - type: auto
    fail-fast: true
  stage2:
    name: Compile
    jobs:
      JOB_x86_A2_compile:
        name: Compile_Ascend_X86_A2
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_X86_A2'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86_A2 }}
          arch: 'x64'
          package_name: 'cann-ops-sparse-A2_linux-x86_64.run'
      JOB_x86_A5_compile:
        name: Compile_Ascend_X86_A5
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_X86_A5'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86_A5 }}
          arch: 'x64'
          package_name: 'cann-ops-sparse-A5_linux-x86_64.run'
      JOB_arm_A2_compile:
        name: Compile_Ascend_ARM_A2
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_ARM_A2'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_ARM_A2 }}
          arch: 'arm64'
          package_name: 'cann-ops-sparse-A2_linux-aarch64.run'
      JOB_arm_A5_compile:
        name: Compile_Ascend_ARM_A5
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_ARM_A5'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_ARM_A5 }}
          arch: 'arm64'
          package_name: 'cann-ops-sparse-A5_linux-aarch64.run'
      JOB_x86_A2_compile_ubuntu24:
        name: Compile_Ascend_X86_A2_ubuntu24
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_X86_A2_ubuntu24'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86_A2 }}
          arch: 'x64'
          package_name: 'cann-ops-sparse-A2_ubuntu24_linux-x86_64.run'
      JOB_x86_A5_compile_ubuntu24:
        name: Compile_Ascend_X86_A5_ubuntu24
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_X86_A5_ubuntu24'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86_A5 }}
          arch: 'x64'
          package_name: 'cann-ops-sparse-A5_ubuntu24_linux-x86_64.run'
      JOB_arm_A2_compile_ubuntu24:
        name: Compile_Ascend_ARM_A2_ubuntu24
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_ARM_A2_ubuntu24'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_ARM_A2 }}
          arch: 'arm64'
          package_name: 'cann-ops-sparse-A2_ubuntu24_linux-aarch64.run'
      JOB_arm_A5_compile_ubuntu24:
        name: Compile_Ascend_ARM_A5_ubuntu24
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_ARM_A5_ubuntu24'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_ARM_A5 }}
          arch: 'arm64'
          package_name: 'cann-ops-sparse-A5_ubuntu24_linux-aarch64.run'
      JOB_codecheck:
        name: CodeCheck
        uses: cann/.gitcode/.gitcode/workflows/codecheck_action.yml@master
        with:
          precommit_image_version: ${{ jobs.JOB_image.outputs.precommit }}
          codecheck_image_version: ${{ jobs.JOB_image.outputs.codecheck }}
      JOB_staticcheck_md_check:
        name: CodeCheck_staticcheck_md_check
        uses: .gitcode/workflows/staticcheck_action.yml
        with:
          check_type: 'md_check'
          image_version: ${{ jobs.JOB_image.outputs.staticcheck }}
    pre:
    - type: auto
    fail-fast: false
  stage3:
    name: Smoke
    jobs:
      PreSmoke_A900:
        name: PreSmoke_A900
        steps:
          -
            name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              allow-unsafe-pr-checkout: true
          -
            name: download
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              key: |
                ${{ env.obs_path }}/pr_filelist.txt
                ${{ env.obs_path }}/pr_filelist_mod.txt
                ${{ env.obs_path }}/update_file_detail.txt
                ${{ env.obs_path }}/pre_smoke.sh
              path: ${{ steps.process_checkout.outputs.path }}
          -
            name: smoke executor
            timeout-minutes: 30
            run: |
                set -e
                # set env
                export WORKSPACE=${{ steps.process_checkout.outputs.path }}
                export smoke_run_file_url=https://ascend-ci.obs.cn-north-4.myhuaweicloud.com/${{ env.obs_path }}/cann-ops-sparse-A2_linux-aarch64.run
                export obs_smoke_path=${{env.obs_smoke_path}}
                export repo_name=${{env.repo_name}}
                export REPOSITORY_NAME=${{env.repo_name}}
                export pr_id=${{ env.MERGE_ID }}
                export AK=${{secrets.AK}}
                export SK=${{secrets.SK}}
                cd ${WORKSPACE}
                bash ${{ steps.process_checkout.outputs.path }}/pre_smoke.sh
          - name: upload
            uses: obs-upload
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              artifact-path: "${{ steps.process_checkout.outputs.path }}/slog*.tar.gz"
              object-prefix: ${obs_smoke_path}/plog/
        if: "${{ default() }}"
        runs-on: ['self-hosted','npu=1','smoke=204']
        container:
          image: swr.cn-south-1.myhuaweicloud.com/pre_smoke/${{ jobs.JOB_image.outputs.PreSmoke_A900 }}
    pre:
    - type: auto
    fail-fast: false

post:
  jobs:
    job_post:
      name: Test_post
      uses: cann/.gitcode/.gitcode/workflows/post_action.yml@master
